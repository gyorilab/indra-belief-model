name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest -q -rs

      - name: Evaluation contamination guard
        run: python scripts/check_contamination.py


# No Node step here, because nothing tracked needs one. The `viewer/` SvelteKit
# app was the last consumer and has been removed. The `/paper` JSON artifacts
# under `data/results/` are now FROZEN RECORDS with no in-tree producer and no
# contract test. They are kept as the record of a finished comparison, and CI
# does not check them. `presentations/` is gitignored (.gitignore:135) and holds
# zero tracked files, so the deck was never buildable here either — that stays
# an local/operator action. CI cannot cover what is not in the repository.
