name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # One lockfile, because one is all that is tracked. The two
          # presentations/ entries that used to sit here named files that cannot
          # exist on a checkout, so they contributed nothing to the cache key.
          cache-dependency-path: viewer/package-lock.json

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest -q

      - name: Evaluation contamination guard
        run: python scripts/check_contamination.py

      - name: Live-document anchor guard
        run: python scripts/check_doc_anchors.py

      - name: Install viewer
        working-directory: viewer
        run: npm ci

      - name: Viewer behavioral and type checks
        working-directory: viewer
        run: |
          npm run test:calibration
          npm run test:cost
          npm run test:curation
          npm run test:paper-literal
          npm run check
          npm run build

# The deck is NOT built here. `presentations/` is gitignored (.gitignore:135)
# and holds zero tracked files, so `npm ci --prefix presentations/...` had no
# directory to run in on any checkout. Checked against every run back to
# 58767d8: that step never once executed — it was `skipped` behind a failing
# test step until the test step was fixed, and then it failed on the first run
# that reached it. Building the deck is a local/operator action; CI cannot
# cover what is not in the repository.
